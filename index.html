<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link href="./src/assets/css/output.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <div class="container mx-auto px-4">
        <div class="flex flex-wrap justify-between items-center py-4 gap-y-4">
          <h1 class="font-bold text-2xl">Exclusive</h1>

          <nav>
            <ul class="flex gap-7 justify-center">
              <li>
                <a href="#" class="hover:underline hover:text-primary">Home</a>
              </li>
              <li>
                <a href="#" class="hover:underline hover:text-primary"
                  >Contact</a
                >
              </li>
              <li>
                <a href="#" class="hover:underline hover:text-primary">About</a>
              </li>
            </ul>
          </nav>

          <div class="md:hidden">
            <i class="fa-solid fa-bars text-xl cursor-pointer"></i>
          </div>

          <div class="hidden md:flex gap-3 items-center">
            <div
              class="search-bar bg-[#e3e0e074] p-2 rounded-md flex items-center"
            >
              <input
                type="text"
                class="text-[#646566] bg-transparent outline-none w-32 lg:w-auto"
                placeholder="What are you looking for?"
              />
              <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <i class="fa-regular fa-heart"></i>
            <i class="fa-solid fa-cart-arrow-down"></i>
          </div>
        </div>
      </div>
    </header>
    <p class="h-0.5 bg-[#e3e0e074]"></p>
    
    
    <section>
      <div class="container mx-auto px-4 py-10">
        <div
          class="bg-black rounded-md px-10 py-12 flex flex-col md:flex-row items-center justify-around gap-6"
        >
          <!-- LEFT -->
          <div class="max-w-md">
            <div class="flex items-center gap-2 mb-4">
              <img
                src="./src/assets/images/AppleIcon.svg"
                alt="apple icon"
                class="w-6"
              />
              <span class="text-white text-sm">iPhone 14 Series</span>
            </div>

            <h3
              class="text-white text-3xl md:text-4xl font-semibold leading-tight"
            >
              Up to 10% <br />
              off Voucher
            </h3>

            <button
              class="mt-6 flex items-center gap-2 text-white pb-1 hover:text-primary"
            >
              Shop Now
              <i class="fa-solid fa-arrow-right"></i>
            </button>
          </div>

          <!-- RIGHT -->
          <div class="right">
            <img
              src="./src/assets/images/iphone.png"
              alt="iphone 14"
              class="w-[250px] md:w-[320px]"
            />
          </div>
        </div>
      </div>
    </section>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
  </body>
</html>
